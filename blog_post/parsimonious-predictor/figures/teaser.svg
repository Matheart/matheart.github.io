<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="720" viewBox="0 0 1800 720">
  <defs>
    <style>
      text { font-family: 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif; fill: #172633; }
      .heading { font-size: 31px; font-weight: 650; letter-spacing: -0.45px; }
      .subheading { font-size: 18px; fill: #526474; }
      .panel-title { font-size: 27px; font-weight: 650; }
      .body { font-size: 21px; }
      .small { font-size: 16px; }
      .tiny { font-size: 12px; }
      .muted { fill: #607383; }
      .white { fill: #FFFFFF; }
      .navy { stroke: #0F4D92; }
      .red { stroke: #B64342; }
      .teal { stroke: #42949E; }
      .gold { stroke: #C9A100; }
      .plot-frame { fill: #FFFFFF; stroke: #425363; stroke-width: 1.35; }
      .curve { fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .mini-curve { fill: none; stroke-width: 1.7; stroke-linecap: round; opacity: .8; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#304A5B"/>
    </marker>
    <filter id="lensShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#162B3A" flood-opacity=".22"/>
    </filter>
    <linearGradient id="blackBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243746"/>
      <stop offset="1" stop-color="#172B3B"/>
    </linearGradient>
    <linearGradient id="lensFill" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#F8FCFF" stop-opacity=".97"/>
      <stop offset="1" stop-color="#DCEAF2" stop-opacity=".96"/>
    </linearGradient>
  </defs>

  <rect width="1800" height="720" fill="#FFFFFF"/>

  <!-- Left: training configurations -->
  <text x="64" y="72" class="heading">Training config</text>
  <text x="64" y="105" class="subheading">Thousands of public pretraining runs</text>
  <rect x="60" y="128" width="400" height="486" rx="20" fill="#F8FAFC" stroke="#B8C8D4" stroke-width="1.5"/>

  <!-- Configuration controls -->
  <g>
    <rect x="78" y="151" width="364" height="52" rx="13" fill="#FFFFFF" stroke="#D5DFE6"/>
    <path d="M96 181 L108 163 L120 181 Z" fill="#0F4D92" opacity=".95"/>
    <text x="134" y="184" class="body">learning rate</text>
    <line x1="278" y1="178" x2="418" y2="178" stroke="#C6D0D8" stroke-width="5" stroke-linecap="round"/>
    <line x1="278" y1="178" x2="326" y2="178" stroke="#0F4D92" stroke-width="5" stroke-linecap="round"/>
    <circle cx="326" cy="178" r="9" fill="#0F4D92" stroke="#FFFFFF" stroke-width="2"/>

    <rect x="78" y="212" width="364" height="52" rx="13" fill="#FFFFFF" stroke="#D5DFE6"/>
    <g fill="#B64342"><circle cx="101" cy="237" r="5"/><circle cx="112" cy="229" r="5"/><circle cx="112" cy="245" r="5"/><circle cx="123" cy="237" r="5"/></g>
    <text x="134" y="245" class="body">batch size</text>
    <line x1="278" y1="239" x2="418" y2="239" stroke="#C6D0D8" stroke-width="5" stroke-linecap="round"/>
    <line x1="278" y1="239" x2="352" y2="239" stroke="#B64342" stroke-width="5" stroke-linecap="round"/>
    <circle cx="352" cy="239" r="9" fill="#B64342" stroke="#FFFFFF" stroke-width="2"/>

    <rect x="78" y="273" width="364" height="52" rx="13" fill="#FFFFFF" stroke="#D5DFE6"/>
    <path d="M98 303 C101 288 115 286 120 295 C123 302 115 310 106 308" fill="none" stroke="#42949E" stroke-width="4" stroke-linecap="round"/>
    <path d="M103 289 L98 303 L112 300" fill="none" stroke="#42949E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="134" y="306" class="body">weight decay</text>
    <line x1="278" y1="300" x2="418" y2="300" stroke="#C6D0D8" stroke-width="5" stroke-linecap="round"/>
    <line x1="278" y1="300" x2="345" y2="300" stroke="#42949E" stroke-width="5" stroke-linecap="round"/>
    <circle cx="345" cy="300" r="9" fill="#42949E" stroke="#FFFFFF" stroke-width="2"/>

    <rect x="78" y="334" width="364" height="52" rx="13" fill="#FFFFFF" stroke="#D5DFE6"/>
    <path d="M109 345 A13 13 0 1 1 98 354" fill="none" stroke="#C9A100" stroke-width="4" stroke-linecap="round"/>
    <path d="M97 345 L98 356 L108 351" fill="none" stroke="#C9A100" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="134" y="367" class="body">warmup</text>
    <line x1="278" y1="361" x2="418" y2="361" stroke="#C6D0D8" stroke-width="5" stroke-linecap="round"/>
    <line x1="278" y1="361" x2="368" y2="361" stroke="#C9A100" stroke-width="5" stroke-linecap="round"/>
    <circle cx="368" cy="361" r="9" fill="#C9A100" stroke="#FFFFFF" stroke-width="2"/>

    <rect x="78" y="395" width="364" height="52" rx="13" fill="#FFFFFF" stroke="#D5DFE6"/>
    <g fill="none" stroke="#B64342" stroke-width="3.2" stroke-linecap="round"><circle cx="109" cy="421" r="10"/><path d="M109 408 L109 414 M109 428 L109 434 M96 421 L102 421 M116 421 L122 421 M100 412 L104 416 M114 426 L118 430"/></g>
    <text x="134" y="428" class="body">optimizer</text>
    <line x1="278" y1="422" x2="418" y2="422" stroke="#C6D0D8" stroke-width="5" stroke-linecap="round"/>
    <line x1="278" y1="422" x2="336" y2="422" stroke="#B64342" stroke-width="5" stroke-linecap="round"/>
    <circle cx="336" cy="422" r="9" fill="#B64342" stroke="#FFFFFF" stroke-width="2"/>

    <rect x="78" y="456" width="364" height="52" rx="13" fill="#FFFFFF" stroke="#D5DFE6"/>
    <rect x="95" y="470" width="27" height="25" rx="5" fill="#0F4D92"/>
    <text x="134" y="489" class="body">model size</text>
    <line x1="278" y1="483" x2="418" y2="483" stroke="#C6D0D8" stroke-width="5" stroke-linecap="round"/>
    <line x1="278" y1="483" x2="360" y2="483" stroke="#42949E" stroke-width="5" stroke-linecap="round"/>
    <circle cx="360" cy="483" r="9" fill="#42949E" stroke="#FFFFFF" stroke-width="2"/>

    <rect x="78" y="517" width="364" height="52" rx="13" fill="#FFFFFF" stroke="#D5DFE6"/>
    <rect x="95" y="530" width="27" height="27" rx="6" fill="#C9A100"/>
    <text x="134" y="550" class="body">tokens</text>
    <line x1="278" y1="544" x2="418" y2="544" stroke="#C6D0D8" stroke-width="5" stroke-linecap="round"/>
    <line x1="278" y1="544" x2="306" y2="544" stroke="#C9A100" stroke-width="5" stroke-linecap="round"/>
    <circle cx="306" cy="544" r="9" fill="#C9A100" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Flow arrow -->
  <path d="M482 370 L535 370" stroke="#304A5B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- Center: configuration-to-trajectory map -->
  <rect x="560" y="125" width="620" height="490" rx="42" fill="url(#blackBox)"/>
  <text x="870" y="185" text-anchor="middle" font-size="35" font-weight="600" class="white" fill="#FFFFFF">the black box</text>
  <text x="870" y="230" text-anchor="middle" font-size="38" font-weight="400" class="white" fill="#FFFFFF">?</text>

  <!-- Small trajectory thumbnails -->
  <g>
    <g fill="#314A5E" stroke="#536B7B" stroke-width="1">
      <rect x="603" y="258" width="115" height="68"/><rect x="728" y="258" width="115" height="68"/><rect x="853" y="258" width="115" height="68"/>
      <rect x="603" y="337" width="115" height="68"/><rect x="728" y="337" width="115" height="68"/><rect x="853" y="337" width="115" height="68"/>
      <rect x="603" y="416" width="115" height="68"/><rect x="728" y="416" width="115" height="68"/><rect x="853" y="416" width="115" height="68"/>
      <rect x="603" y="495" width="115" height="68"/><rect x="728" y="495" width="115" height="68"/><rect x="853" y="495" width="115" height="68"/>
    </g>
    <g class="mini-curve">
      <path d="M612 267 C622 299 650 307 708 311" stroke="#B64342"/><path d="M737 267 C750 294 774 302 835 306" stroke="#C9A100"/><path d="M862 267 C872 296 910 304 958 307" stroke="#42949E"/>
      <path d="M612 346 C621 377 653 386 707 390" stroke="#42949E"/><path d="M737 346 C748 375 776 383 835 387" stroke="#B64342"/><path d="M862 346 C879 376 915 384 958 387" stroke="#C9A100"/>
      <path d="M612 425 C625 456 659 463 707 466" stroke="#C9A100"/><path d="M737 425 C749 453 777 463 835 466" stroke="#42949E"/><path d="M862 425 C879 453 908 461 958 464" stroke="#B64342"/>
      <path d="M612 504 C621 534 655 543 707 546" stroke="#B64342"/><path d="M737 504 C748 533 780 542 835 546" stroke="#C9A100"/><path d="M862 504 C877 532 910 542 958 545" stroke="#42949E"/>
    </g>
  </g>

  <!-- Magnifier -->
  <g filter="url(#lensShadow)">
    <path d="M1054 494 L1150 605 Q1163 620 1178 608 Q1190 597 1178 582 L1081 475 Z" fill="#334C5E" stroke="#162B3A" stroke-width="5"/>
    <path d="M1071 501 L1162 603" stroke="#6D8494" stroke-width="5" stroke-linecap="round" opacity=".55"/>
    <circle cx="956" cy="380" r="145" fill="#172B3B" stroke="#D9E1E6" stroke-width="8"/>
    <circle cx="956" cy="380" r="135" fill="url(#lensFill)" stroke="#718391" stroke-width="2.5"/>
    <path d="M844 268 Q932 220 1048 278" fill="none" stroke="#FFFFFF" stroke-width="9" opacity=".48" stroke-linecap="round"/>
  </g>
  <g>
    <text x="860" y="298" font-size="15" fill="#172633"><tspan font-weight="700">early:</tspan><tspan> token budget</tspan></text>
    <rect x="860.0" y="311" width="126.4" height="12" fill="#0F4D92"/>
    <rect x="986.4" y="311" width="26.2" height="12" fill="#B64342"/>
    <rect x="1012.6" y="311" width="15.8" height="12" fill="#C9A100"/>
    <rect x="1028.4" y="311" width="21.6" height="12" fill="#42949E"/>

    <text x="860" y="360" font-size="15" fill="#172633"><tspan font-weight="700">middle:</tspan><tspan> learning rate,</tspan></text>
    <text x="860" y="379" font-size="15" fill="#172633">weight decay</text>
    <rect x="860.0" y="389" width="19.5" height="12" fill="#0F4D92"/>
    <rect x="879.5" y="389" width="71.9" height="12" fill="#B64342"/>
    <rect x="951.4" y="389" width="61.6" height="12" fill="#C9A100"/>
    <rect x="1013.0" y="389" width="37.0" height="12" fill="#42949E"/>

    <text x="860" y="438" font-size="15" fill="#172633"><tspan font-weight="700">end:</tspan><tspan> learning rate,</tspan></text>
    <text x="860" y="457" font-size="15" fill="#172633">token budget</text>
    <rect x="860.0" y="467" width="59.8" height="12" fill="#0F4D92"/>
    <rect x="919.8" y="467" width="64.2" height="12" fill="#B64342"/>
    <rect x="984.0" y="467" width="35.6" height="12" fill="#C9A100"/>
    <rect x="1019.7" y="467" width="30.3" height="12" fill="#42949E"/>

  </g>

  <!-- Flow arrow -->
  <path d="M1202 370 L1260 370" stroke="#304A5B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- Right: training trajectories -->
  <text x="1300" y="72" class="heading">Training trajectory</text>

  <!-- (a) loss -->
  <text x="1310" y="170" font-size="20" text-anchor="middle">(a)</text>
  <text x="1310" y="195" font-size="18" text-anchor="middle">loss</text>
  <g transform="translate(165,0) scale(0.9,1)">
    <rect x="1350" y="120" width="390" height="102" class="plot-frame"/>
    <path d="M1366 130 C1380 183 1411 189 1470 196 C1545 204 1640 207 1719 209" class="curve" stroke="#0F4D92"/>
    <path d="M1366 130 C1385 180 1426 188 1480 192 C1552 197 1645 198 1694 200 C1713 201 1711 210 1720 212" class="curve" stroke="#C9A100"/>
    <path d="M1366 222 L1366 226 M1444 222 L1444 226 M1522 222 L1522 226 M1600 222 L1600 226 M1678 222 L1678 226" stroke="#526474" stroke-width="1.1"/>
  </g>

  <!-- (b) accuracy -->
  <text x="1310" y="291" font-size="20" text-anchor="middle">(b)</text>
  <text x="1310" y="316" font-size="18" text-anchor="middle">accuracy</text>
  <g transform="translate(165,0) scale(0.9,1)">
    <rect x="1350" y="241" width="390" height="102" class="plot-frame"/>
    <path d="M1366 336 C1432 330 1500 321 1574 313 C1620 309 1640 297 1662 272 C1677 255 1697 250 1722 248" class="curve" stroke="#B64342"/>
    <path d="M1366 336 C1450 333 1521 327 1584 318 C1620 313 1645 308 1660 289 C1677 268 1691 254 1722 253" class="curve" stroke="#42949E"/>
    <path d="M1366 343 L1366 347 M1444 343 L1444 347 M1522 343 L1522 347 M1600 343 L1600 347 M1678 343 L1678 347" stroke="#526474" stroke-width="1.1"/>
  </g>

  <!-- (c) parameter norm -->
  <text x="1310" y="412" font-size="20" text-anchor="middle">(c)</text>
  <text x="1310" y="437" font-size="16" text-anchor="middle">parameter</text>
  <text x="1310" y="460" font-size="18" text-anchor="middle">norm</text>
  <g transform="translate(165,0) scale(0.9,1)">
    <rect x="1350" y="362" width="390" height="102" class="plot-frame"/>
    <path d="M1366 455 C1387 405 1425 389 1475 382 C1544 371 1631 372 1722 371" class="curve" stroke="#0F4D92"/>
    <path d="M1366 455 C1394 412 1432 393 1484 386 C1550 378 1640 378 1722 378" class="curve" stroke="#42949E"/>
    <path d="M1366 455 C1392 420 1437 410 1490 405 C1570 398 1640 398 1722 399" class="curve" stroke="#B64342"/>
    <path d="M1366 464 L1366 468 M1444 464 L1444 468 M1522 464 L1522 468 M1600 464 L1600 468 M1678 464 L1678 468" stroke="#526474" stroke-width="1.1"/>
  </g>

  <!-- (d) gradient norm -->
  <text x="1310" y="533" font-size="20" text-anchor="middle">(d)</text>
  <text x="1310" y="558" font-size="16" text-anchor="middle">gradient</text>
  <text x="1310" y="581" font-size="18" text-anchor="middle">norm</text>
  <g transform="translate(165,0) scale(0.9,1)">
    <rect x="1350" y="483" width="390" height="102" class="plot-frame"/>
    <path d="M1366 490 C1390 531 1425 543 1480 551 C1552 562 1640 563 1690 566 C1704 567 1707 553 1722 552" class="curve" stroke="#B64342"/>
    <path d="M1366 490 C1388 541 1425 557 1485 568 C1550 579 1632 581 1690 582 C1708 583 1710 570 1722 570" class="curve" stroke="#42949E"/>
    <path d="M1366 585 L1366 590 M1444 585 L1444 590 M1522 585 L1522 590 M1600 585 L1600 590 M1678 585 L1678 590" stroke="#526474" stroke-width="1.1"/>
    <g font-size="15" fill="#526474" text-anchor="middle">
      <text x="1366" y="611">0.0</text><text x="1444" y="611">0.2</text><text x="1522" y="611">0.4</text><text x="1600" y="611">0.6</text><text x="1678" y="611">0.8</text><text x="1738" y="611">1.0</text>
    </g>
  </g>
  <text x="1560" y="638" font-size="18" fill="#526474" text-anchor="middle">training fraction (0 to 1)</text>

  <!-- Bottom flow labels -->
  <g fill="#304A5B" font-size="19" font-weight="600">
    <text x="260" y="680" text-anchor="middle">Training config</text>
    <text x="870" y="680" text-anchor="middle">config → trajectory map</text>
    <text x="1530" y="680" text-anchor="middle">Training trajectory</text>
  </g>
  <path d="M470 673 L655 673" stroke="#8293A0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1083 673 L1330 673" stroke="#8293A0" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
